<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" font-family="Segoe UI, Tahoma, Arial, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: 600; fill: #1f2937; }
    .sub { font-size: 13px; fill: #4b5563; }
    .box { fill: #ffffff; stroke: #1e3a8a; stroke-width: 1.5; }
    .head { fill: #1e3a8a; }
    .headtext { font-size: 15px; font-weight: 600; fill: #ffffff; }
    .row { font-size: 13px; fill: #111827; }
    .type { font-size: 12px; fill: #6b7280; }
    .pk { fill: #fef3c7; }
    .fk { fill: #dbeafe; }
    .uq { fill: #ecfdf5; }
    .tag { font-size: 10px; font-weight: 700; }
    .tpk { fill: #92400e; }
    .tfk { fill: #1e40af; }
    .tuq { fill: #047857; }
    .sep { stroke: #e5e7eb; stroke-width: 1; }
    .rel { fill: none; stroke: #374151; stroke-width: 1.6; }
    .opt { stroke-dasharray: 6 4; }
    .end { stroke: #374151; stroke-width: 1.6; fill: none; }
    .circ { stroke: #374151; stroke-width: 1.6; fill: #ffffff; }
    .lbl { font-size: 12px; fill: #374151; font-style: italic; }
    .legend { font-size: 12px; fill: #374151; }
  </style>
  <rect width="1120" height="720" fill="#ffffff"/>

  <text class="title" x="40" y="38">ShelfLife database V2 (shelflife_v2_db)</text>
  <text class="sub" x="40" y="60">4 tables · each fact stored once · inventory_items points to products by product_id</text>

  <!-- ============ users ============ -->
  <rect class="box" x="40" y="80" width="300" height="218" rx="6"/>
  <path class="head" d="M46 80 H334 A6 6 0 0 1 340 86 V116 H40 V86 A6 6 0 0 1 46 80 Z"/>
  <text class="headtext" x="52" y="104">users</text>
  <rect class="pk" x="41" y="116" width="298" height="26"/>
  <rect class="uq" x="41" y="142" width="298" height="52"/>
  <text class="tag tpk" x="50" y="133">PK</text><text class="row" x="80" y="133">user_id</text><text class="type" x="330" y="133" text-anchor="end">INT</text>
  <line class="sep" x1="41" y1="142" x2="339" y2="142"/>
  <text class="tag tuq" x="50" y="159">UQ</text><text class="row" x="80" y="159">username</text><text class="type" x="330" y="159" text-anchor="end">VARCHAR(50)</text>
  <line class="sep" x1="41" y1="168" x2="339" y2="168"/>
  <text class="tag tuq" x="50" y="185">UQ</text><text class="row" x="80" y="185">email</text><text class="type" x="330" y="185" text-anchor="end">VARCHAR(254) NULL</text>
  <line class="sep" x1="41" y1="194" x2="339" y2="194"/>
  <text class="row" x="80" y="211">password_hash</text><text class="type" x="330" y="211" text-anchor="end">VARCHAR(255)</text>
  <line class="sep" x1="41" y1="220" x2="339" y2="220"/>
  <text class="row" x="80" y="237">role</text><text class="type" x="330" y="237" text-anchor="end">ENUM(user, admin)</text>
  <line class="sep" x1="41" y1="246" x2="339" y2="246"/>
  <text class="row" x="80" y="263">created_at</text><text class="type" x="330" y="263" text-anchor="end">TIMESTAMP</text>
  <line class="sep" x1="41" y1="272" x2="339" y2="272"/>
  <text class="row" x="80" y="289">updated_at</text><text class="type" x="330" y="289" text-anchor="end">TIMESTAMP</text>

  <!-- ============ products ============ -->
  <rect class="box" x="760" y="80" width="320" height="218" rx="6"/>
  <path class="head" d="M766 80 H1074 A6 6 0 0 1 1080 86 V116 H760 V86 A6 6 0 0 1 766 80 Z"/>
  <text class="headtext" x="772" y="104">products</text>
  <rect class="pk" x="761" y="116" width="318" height="26"/>
  <rect class="uq" x="761" y="142" width="318" height="26"/>
  <rect class="fk" x="761" y="194" width="318" height="52"/>
  <rect class="uq" x="761" y="272" width="318" height="25"/>
  <text class="tag tpk" x="770" y="133">PK</text><text class="row" x="800" y="133">product_id</text><text class="type" x="1070" y="133" text-anchor="end">INT</text>
  <line class="sep" x1="761" y1="142" x2="1079" y2="142"/>
  <text class="tag tuq" x="770" y="159">UQ</text><text class="row" x="800" y="159">barcode</text><text class="type" x="1070" y="159" text-anchor="end">VARCHAR(50) NULL</text>
  <line class="sep" x1="761" y1="168" x2="1079" y2="168"/>
  <text class="row" x="800" y="185">product_name</text><text class="type" x="1070" y="185" text-anchor="end">VARCHAR(100)</text>
  <line class="sep" x1="761" y1="194" x2="1079" y2="194"/>
  <text class="tag tfk" x="770" y="211">FK</text><text class="row" x="800" y="211">category_id</text><text class="type" x="1070" y="211" text-anchor="end">INT</text>
  <line class="sep" x1="761" y1="220" x2="1079" y2="220"/>
  <text class="tag tfk" x="770" y="237">FK</text><text class="row" x="800" y="237">created_by</text><text class="type" x="1070" y="237" text-anchor="end">INT NULL</text>
  <line class="sep" x1="761" y1="246" x2="1079" y2="246"/>
  <text class="row" x="800" y="263">created_at</text><text class="type" x="1070" y="263" text-anchor="end">TIMESTAMP</text>
  <line class="sep" x1="761" y1="272" x2="1079" y2="272"/>
  <text class="tag tuq" x="770" y="289">UQ</text><text class="row" x="800" y="289">unbarcoded_name</text><text class="type" x="1070" y="289" text-anchor="end">auto · UQ with category_id</text>

  <!-- ============ inventory_items ============ -->
  <rect class="box" x="400" y="340" width="320" height="270" rx="6"/>
  <path class="head" d="M406 340 H714 A6 6 0 0 1 720 346 V376 H400 V346 A6 6 0 0 1 406 340 Z"/>
  <text class="headtext" x="412" y="364">inventory_items</text>
  <rect class="pk" x="401" y="376" width="318" height="26"/>
  <rect class="fk" x="401" y="402" width="318" height="52"/>
  <text class="tag tpk" x="410" y="393">PK</text><text class="row" x="440" y="393">item_id</text><text class="type" x="710" y="393" text-anchor="end">INT</text>
  <line class="sep" x1="401" y1="402" x2="719" y2="402"/>
  <text class="tag tfk" x="410" y="419">FK</text><text class="row" x="440" y="419">user_id</text><text class="type" x="710" y="419" text-anchor="end">INT</text>
  <line class="sep" x1="401" y1="428" x2="719" y2="428"/>
  <text class="tag tfk" x="410" y="445">FK</text><text class="row" x="440" y="445">product_id</text><text class="type" x="710" y="445" text-anchor="end">INT</text>
  <line class="sep" x1="401" y1="454" x2="719" y2="454"/>
  <text class="row" x="440" y="471">quantity</text><text class="type" x="710" y="471" text-anchor="end">INT · CHECK &gt; 0</text>
  <line class="sep" x1="401" y1="480" x2="719" y2="480"/>
  <text class="row" x="440" y="497">expiration_date</text><text class="type" x="710" y="497" text-anchor="end">DATE</text>
  <line class="sep" x1="401" y1="506" x2="719" y2="506"/>
  <text class="row" x="440" y="523">status</text><text class="type" x="710" y="523" text-anchor="end">ENUM(active, consumed, discarded)</text>
  <line class="sep" x1="401" y1="532" x2="719" y2="532"/>
  <text class="row" x="440" y="549">status_updated_at</text><text class="type" x="710" y="549" text-anchor="end">TIMESTAMP NULL</text>
  <line class="sep" x1="401" y1="558" x2="719" y2="558"/>
  <text class="row" x="440" y="575">created_at</text><text class="type" x="710" y="575" text-anchor="end">TIMESTAMP</text>
  <line class="sep" x1="401" y1="584" x2="719" y2="584"/>
  <text class="row" x="440" y="601">updated_at</text><text class="type" x="710" y="601" text-anchor="end">TIMESTAMP</text>

  <!-- ============ categories ============ -->
  <rect class="box" x="760" y="470" width="320" height="88" rx="6"/>
  <path class="head" d="M766 470 H1074 A6 6 0 0 1 1080 476 V506 H760 V476 A6 6 0 0 1 766 470 Z"/>
  <text class="headtext" x="772" y="494">categories</text>
  <rect class="pk" x="761" y="506" width="318" height="26"/>
  <rect class="uq" x="761" y="532" width="318" height="25"/>
  <text class="tag tpk" x="770" y="523">PK</text><text class="row" x="800" y="523">category_id</text><text class="type" x="1070" y="523" text-anchor="end">INT</text>
  <line class="sep" x1="761" y1="532" x2="1079" y2="532"/>
  <text class="tag tuq" x="770" y="549">UQ</text><text class="row" x="800" y="549">category_name</text><text class="type" x="1070" y="549" text-anchor="end">VARCHAR(50)</text>

  <!-- ============ relationships ============ -->
  <!-- users 1 —— 0..N inventory_items (ON DELETE CASCADE) -->
  <path class="rel" d="M190 298 V415 H377"/>
  <line class="end" x1="182" y1="306" x2="198" y2="306"/><line class="end" x1="182" y1="312" x2="198" y2="312"/>
  <circle class="circ" cx="381" cy="415" r="4"/>
  <path class="end" d="M385 415 L400 405 M385 415 L400 415 M385 415 L400 425"/>
  <text class="lbl" x="200" y="407">owns (delete user → delete batches)</text>

  <!-- products 1 —— 0..N inventory_items (ON DELETE RESTRICT) -->
  <path class="rel" d="M800 298 V441 H743"/>
  <line class="end" x1="792" y1="306" x2="808" y2="306"/><line class="end" x1="792" y1="312" x2="808" y2="312"/>
  <circle class="circ" cx="739" cy="441" r="4"/>
  <path class="end" d="M735 441 L720 431 M735 441 L720 441 M735 441 L720 451"/>
  <text class="lbl" x="808" y="372">stocked as</text>

  <!-- categories 1 —— 0..N products -->
  <path class="rel" d="M920 470 V321"/>
  <line class="end" x1="912" y1="462" x2="928" y2="462"/><line class="end" x1="912" y1="456" x2="928" y2="456"/>
  <circle class="circ" cx="920" cy="317" r="4"/>
  <path class="end" d="M920 313 L910 298 M920 313 L920 298 M920 313 L930 298"/>
  <text class="lbl" x="930" y="392">groups</text>

  <!-- users 0..1 —— 0..N products (created_by, ON DELETE SET NULL) -->
  <path class="rel opt" d="M737 233 H560 V129 H364"/>
  <circle class="circ" cx="360" cy="129" r="4"/>
  <line class="end" x1="350" y1="121" x2="350" y2="137"/>
  <line class="end" x1="340" y1="129" x2="356" y2="129"/>
  <circle class="circ" cx="741" cy="233" r="4"/>
  <path class="end" d="M745 233 L760 223 M745 233 L760 233 M745 233 L760 243"/>
  <text class="lbl" x="568" y="186">created_by (optional)</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="640" width="1040" height="56" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
  <rect class="pk" x="56" y="652" width="14" height="14" stroke="#d1d5db"/><text class="legend" x="76" y="664">PK primary key</text>
  <rect class="fk" x="190" y="652" width="14" height="14" stroke="#d1d5db"/><text class="legend" x="210" y="664">FK foreign key</text>
  <rect class="uq" x="322" y="652" width="14" height="14" stroke="#d1d5db"/><text class="legend" x="342" y="664">UQ unique</text>
  <line class="end" x1="440" y1="659" x2="470" y2="659"/><line class="end" x1="448" y1="652" x2="448" y2="666"/><line class="end" x1="454" y1="652" x2="454" y2="666"/>
  <text class="legend" x="478" y="664">exactly one</text>
  <line class="end" x1="572" y1="659" x2="592" y2="659"/><circle class="circ" cx="596" cy="659" r="4"/><path class="end" d="M600 659 L614 651 M600 659 L614 659 M600 659 L614 667"/>
  <text class="legend" x="622" y="664">zero or many</text>
  <line class="end opt" x1="720" y1="659" x2="760" y2="659"/>
  <text class="legend" x="768" y="664">optional link (may be NULL)</text>
  <text class="legend" x="56" y="686">Rule: a consumed/discarded batch must have status_updated_at · a product still in someone's inventory cannot be deleted</text>
</svg>
