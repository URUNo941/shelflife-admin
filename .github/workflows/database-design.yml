name: Database design only
on:
  push:
    paths: ['shelflife-backend/database/simple-v2/**', '.github/workflows/database-design.yml']
  pull_request:
    paths: ['shelflife-backend/database/simple-v2/**', '.github/workflows/database-design.yml']
jobs:
  database:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: ['mysql:8.4', 'mariadb:10.11']
    services:
      db:
        image: ${{ matrix.engine }}
        env:
          MYSQL_ROOT_PASSWORD: local-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -plocal-test-only || mariadb-admin ping -h 127.0.0.1 -plocal-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: shelflife-backend
      - run: node --test database/simple-v2/database.test.js
        working-directory: shelflife-backend
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASSWORD: local-test-only
